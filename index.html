<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keshav Karn — CSE Student & Developer</title>
    <meta name="description" content="Portfolio of Keshav Karn — a CSE student building secure full-stack, Android, AI/ML, cybersecurity, and IoT products." />
    <meta property="og:title" content="Keshav Karn — CSE Student & Developer" />
    <meta property="og:description" content="CSE student building secure, maintainable, and user-centered full-stack, AI/ML, Android, cybersecurity, and IoT products." />
    <meta property="og:type" content="website" />
    <script>
      // Prevent FOUC: apply saved theme before first paint
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
