<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keshav Kumar Karn — Software Engineer</title>
    <meta name="description" content="Portfolio of Keshav Kumar Karn — Software Engineer building full-stack web applications, AI/ML models, native Android apps, and IoT devices. B.Tech at Thapar Institute." />
    <meta property="og:title" content="Keshav Kumar Karn — Software Engineer" />
    <meta property="og:description" content="Software Engineer specializing in Full-Stack Web, AI/ML, native Android apps, and IoT devices." />
    <meta property="og:type" content="website" />
    <script>
      // Prevent FOUC: apply saved theme before first paint
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
