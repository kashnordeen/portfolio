    <text x="600" y="176" fill="#fff" font-family="Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="4">FINDORA</text>
    <text x="600" y="229" fill="#d1d5db" font-family="Arial, sans-serif" font-size="28">Reuniting people with what matters.</text>
  </g>
