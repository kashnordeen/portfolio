<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">FINDORA project artwork</title>
  <desc id="description">A violet AI-powered lost and found interface with search, location, and matching elements.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132d"/>
      <stop offset="0.55" stop-color="#37206b"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#080510" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#background)"/>
  <circle cx="915" cy="170" r="310" fill="url(#glow)"/>
  <circle cx="180" cy="650" r="280" fill="url(#glow)" opacity=".45"/>
