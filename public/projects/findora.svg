      <path d="M74 40c-17 0-30 13-30 30 0 23 30 49 30 49s30-26 30-49c0-17-13-30-30-30Zm0 43a13 13 0 1 1 0-26 13 13 0 0 1 0 26Z" fill="url(#accent)"/>
